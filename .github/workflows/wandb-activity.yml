name: wandb activity graph

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install wandb

      - name: Render heatmap
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: python scripts/wandb_activity.py --entity yandabao --out wandb-activity.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wandb-activity.svg
          git diff --staged --quiet || git commit -m "Update wandb activity graph"
          git push
